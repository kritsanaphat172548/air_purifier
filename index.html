<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART AIR PURIFIER (CLOUD)</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border: none;
      border-radius: 12px;
    }
    .card-val {
      font-size: 3rem;
      font-weight: bold;
    }
    .unit-text {
      color: #6c757d;
      font-size: 0.85rem;
    }
    .sub-pm-text {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .temp-val {
      font-size: 1.8rem;
      font-weight: bold;
      color: #dc3545;
    }
    .humid-val {
      font-size: 1.8rem;
      font-weight: bold;
      color: #0dcaf0;
    }
    .btn-mode-container {
      display: flex;
      border: 1px solid #ced4da;
      border-radius: 6px;
      overflow: hidden;
    }
    .btn-mode {
      flex: 1;
      border: none;
      background: #ffffff;
      color: #0d6efd;
      padding: 8px 0;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-mode.active {
      background-color: #0d6efd;
      color: #ffffff;
    }
    .btn-mode:first-child {
      border-right: 1px solid #ced4da;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 1000px;">
    <!-- Title Header -->
    <h3 class="text-center fw-bold mb-4" style="letter-spacing: 1px;">SMART AIR PURIFIER (CLOUD)</h3>

    <!-- Top Cards Layout -->
    <div class="row g-3 mb-4">
      
      <!-- 1. PM Dust Card (PM 2.5 หลัก + PM 1.0 และ PM 10) -->
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm h-100 d-flex flex-column justify-content-between">
          <div class="text-dark fw-semibold">ระดับค่าฝุ่น</div>
          
          <!-- PM 2.5 หลัก -->
          <div class="my-1">
            <div id="pm25Val" class="card-val text-success">0</div>
            <div class="unit-text">PM 2.5 (ug/m³)</div>
          </div>

          <!-- PM 1.0 & PM 10 ย่อย -->
          <div class="row pt-2 border-top">
            <div class="col-6 border-end">
              <span class="unit-text d-block">PM 1.0</span>
              <span id="pm10Val" class="sub-pm-text text-primary">0</span> <small class="unit-text">ug/m³</small>
            </div>
            <div class="col-6">
              <span class="unit-text d-block">PM 10</span>
              <span id="pm100Val" class="sub-pm-text text-warning">0</span> <small class="unit-text">ug/m³</small>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Temp / Humid Card -->
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm h-100 d-flex flex-column justify-content-between">
          <div class="text-dark fw-semibold">อุณหภูมิ / ความชื้น</div>
          <div class="my-auto">
            <div id="tempVal" class="temp-val mb-1">0.0 °C</div>
            <div id="humidVal" class="humid-val">0.0 %</div>
          </div>
          <div></div>
        </div>
      </div>

      <!-- 3. Control Card -->
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm h-100">
          <div class="text-dark fw-semibold mb-3">ควบคุมการทำงาน</div>
          
          <div class="btn-mode-container mb-3">
            <button id="btnAuto" class="btn-mode active" onclick="setMode(true)">AUTO</button>
            <button id="btnManual" class="btn-mode" onclick="setMode(false)">MANUAL</button>
          </div>

          <div class="mt-2">
            <input type="range" class="form-range" id="fanSlider" min="0" max="100" value="0" oninput="updateSpeedLabel(this.value)" onchange="setFanSpeed(this.value)">
            <div class="text-center mt-2">
              <small class="text-dark">ความเร็วพัดลม: <span id="speedLabel">0</span>%</small>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Data Logging Chart Card -->
    <div class="card p-4 shadow-sm">
      <h6 class="fw-bold text-dark mb-3">ประวัติค่าฝุ่นย้อนหลัง (Data Logging)</h6>
      <div style="position: relative; height:280px;">
        <canvas id="logChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ===== 1. Firebase Configuration =====
    const firebaseConfig = {
      databaseURL: "https://diy-air-purifier-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ===== 2. Chart.js Initialization (รองรับทั้ง PM1.0, PM2.5, PM10) =====
    const ctx = document.getElementById('logChart').getContext('2d');
    const logChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'PM 2.5',
            data: [],
            borderColor: '#28a745',
            backgroundColor: 'rgba(40, 167, 69, 0.05)',
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.2
          },
          {
            label: 'PM 1.0',
            data: [],
            borderColor: '#0d6efd',
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false,
            tension: 0.2
          },
          {
            label: 'PM 10',
            data: [],
            borderColor: '#ffc107',
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false,
            tension: 0.2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            grid: { color: '#e9ecef' }
          },
          x: {
            grid: { display: false }
          }
        },
        plugins: {
          legend: {
            display: true,
            position: 'top'
          }
        }
      }
    });

    // ===== 3. Control Functions =====
    function setMode(isAuto) {
      database.ref('/air_purifier/control/isAuto').set(isAuto);
    }

    function setFanSpeed(val) {
      database.ref('/air_purifier/control/fanSpeed').set(parseInt(val));
    }

    function updateSpeedLabel(val) {
      document.getElementById('speedLabel').innerText = val;
    }

    function updateUIState(isAuto) {
      const btnAuto = document.getElementById('btnAuto');
      const btnManual = document.getElementById('btnManual');
      const slider = document.getElementById('fanSlider');

      if (isAuto) {
        btnAuto.classList.add('active');
        btnManual.classList.remove('active');
        slider.disabled = true;
      } else {
        btnManual.classList.add('active');
        btnAuto.classList.remove('active');
        slider.disabled = false;
      }
    }

    // ===== 4. Realtime Data Listeners =====
    
    // ฟังค่า Live Data (PM1.0, PM2.5, PM10)
    database.ref('/air_purifier/live').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        // อัปเดตค่า PM2.5
        const pm25 = data.pm25 !== undefined ? data.pm25 : 0;
        const pmElem = document.getElementById('pm25Val');
        pmElem.innerText = pm25;

        if (pm25 <= 15) pmElem.className = "card-val text-success";
        else if (pm25 <= 37) pmElem.className = "card-val text-warning";
        else pmElem.className = "card-val text-danger";

        // อัปเดตค่า PM1.0 และ PM10
        document.getElementById('pm10Val').innerText = data.pm10 !== undefined ? data.pm10 : 0;
        document.getElementById('pm100Val').innerText = data.pm100 !== undefined ? data.pm100 : 0;

        // อัปเดต Temp & Humid
        document.getElementById('tempVal').innerText = (data.temp ? data.temp.toFixed(1) : "0.0") + " °C";
        document.getElementById('humidVal').innerText = (data.humid ? data.humid.toFixed(1) : "0.0") + " %";
      }
    });

    // ฟังค่า Control
    database.ref('/air_purifier/control').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.isAuto !== undefined) updateUIState(data.isAuto);
        if (data.fanSpeed !== undefined) {
          document.getElementById('fanSlider').value = data.fanSpeed;
          document.getElementById('speedLabel').innerText = data.fanSpeed;
        }
      }
    });

    // ฟังค่า Data Logging
    database.ref('/air_purifier/logs').limitToLast(20).on('value', (snapshot) => {
      const logs = snapshot.val();
      if (logs) {
        const labels = [];
        const pm25Data = [];
        const pm10Data = [];
        const pm100Data = [];
        
        Object.keys(logs).forEach((key) => {
          labels.push("");
          pm25Data.push(logs[key].pm25 || 0);
          pm10Data.push(logs[key].pm10 || 0);
          pm100Data.push(logs[key].pm100 || 0);
        });

        logChart.data.labels = labels;
        logChart.data.datasets[0].data = pm25Data;
        logChart.data.datasets[1].data = pm10Data;
        logChart.data.datasets[2].data = pm100Data;
        logChart.update();
      }
    });
  </script>
</body>
</html>
