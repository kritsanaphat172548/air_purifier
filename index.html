<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART AIR PURIFIER (CLOUD)</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-val { font-size: 2.5rem; font-weight: bold; }
    .btn-group .btn.active { font-weight: bold; }
  </style>
</head>
<body>

  <div class="container py-4">
    <h3 class="text-center fw-bold mb-4">SMART AIR PURIFIER (CLOUD)</h3>

    <div class="row g-3 mb-4">
      <!-- PM 2.5 Display -->
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm h-100">
          <div class="text-muted fw-semibold">PM 2.5</div>
          <div id="pm25Val" class="card-val text-success my-auto">0</div>
          <div class="text-muted"><small>ug/m³</small></div>
        </div>
      </div>

      <!-- Temp & Humidity Display -->
      <div class="col-md-4">
        <div class="card p-3 text-center shadow-sm h-100">
          <div class="text-muted fw-semibold">อุณหภูมิ / ความชื้น</div>
          <div class="my-auto">
            <div id="tempVal" class="fs-3 fw-bold text-danger">0.0 °C</div>
            <div id="humidVal" class="fs-4 fw-bold text-info">0.0 %</div>
          </div>
        </div>
      </div>

      <!-- Control Box (ตัดปุ่มเปิดปิด ออกแล้ว) -->
      <div class="col-md-4">
        <div class="card p-3 shadow-sm h-100">
          <div class="text-muted fw-semibold text-center mb-3">ควบคุมการทำงาน</div>
          
          <div class="btn-group w-100 mb-3" role="group">
            <button type="button" id="btnAuto" class="btn btn-outline-primary" onclick="setMode(true)">AUTO</button>
            <button type="button" id="btnManual" class="btn btn-outline-primary" onclick="setMode(false)">MANUAL</button>
          </div>

          <div class="mt-2">
            <input type="range" class="form-range" id="fanSlider" min="0" max="100" value="0" oninput="updateSpeedLabel(this.value)" onchange="setFanSpeed(this.value)">
            <div class="text-center">
              <small class="text-muted">ความเร็วพัดลม: <span id="speedLabel" class="fw-bold">0</span>%</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Data Logging Chart -->
    <div class="card p-3 shadow-sm">
      <h6 class="fw-bold text-muted mb-3">ประวัติค่าฝุ่นย้อนหลัง (Data Logging)</h6>
      <canvas id="logChart" height="100"></canvas>
    </div>
  </div>

  <script>
    // ===== ตั้งค่า Firebase Config =====
    const firebaseConfig = {
      databaseURL: "https://diy-air-purifier-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Chart.js Setup
    const ctx = document.getElementById('logChart').getContext('2d');
    const logChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'PM 2.5 (ug/m³)',
          data: [],
          borderColor: '#28a745',
          backgroundColor: 'rgba(40, 167, 69, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    // ===== การสั่งงานควบคุมไปที่ Firebase =====
    function setMode(isAuto) {
      database.ref('/air_purifier/control/isAuto').set(isAuto);
    }

    function setFanSpeed(val) {
      database.ref('/air_purifier/control/fanSpeed').set(parseInt(val));
    }

    function updateSpeedLabel(val) {
      document.getElementById('speedLabel').innerText = val;
    }

    function updateUIState(isAuto) {
      const btnAuto = document.getElementById('btnAuto');
      const btnManual = document.getElementById('btnManual');
      const slider = document.getElementById('fanSlider');

      if (isAuto) {
        btnAuto.className = "btn btn-primary active";
        btnManual.className = "btn btn-outline-primary";
        slider.disabled = true;
      } else {
        btnAuto.className = "btn btn-outline-primary";
        btnManual.className = "btn btn-primary active";
        slider.disabled = false;
      }
    }

    // ===== ฟังค่า Realtime Data จาก Firebase =====
    database.ref('/air_purifier/live').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('pm25Val').innerText = data.pm25 || 0;
        document.getElementById('tempVal').innerText = (data.temp ? data.temp.toFixed(1) : "0.0") + " °C";
        document.getElementById('humidVal').innerText = (data.humid ? data.humid.toFixed(1) : "0.0") + " %";

        // สีตัวเลขตามระดับค่าฝุ่น
        const pmElem = document.getElementById('pm25Val');
        if (data.pm25 <= 15) pmElem.className = "card-val text-success my-auto";
        else if (data.pm25 <= 37) pmElem.className = "card-val text-warning my-auto";
        else pmElem.className = "card-val text-danger my-auto";
      }
    });

    // ฟังค่า Control ซิงค์ปุ่มบนหน้าเว็บ
    database.ref('/air_purifier/control').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.isAuto !== undefined) updateUIState(data.isAuto);
        if (data.fanSpeed !== undefined) {
          document.getElementById('fanSlider').value = data.fanSpeed;
          document.getElementById('speedLabel').innerText = data.fanSpeed;
        }
      }
    });

    // โหลดประวัติ Data Logs
    database.ref('/air_purifier/logs').limitToLast(15).on('value', (snapshot) => {
      const logs = snapshot.val();
      if (logs) {
        const labels = [];
        const pm25Data = [];
        let count = 1;
        Object.keys(logs).forEach((key) => {
          labels.push("Log " + count++);
          pm25Data.push(logs[key].pm25);
        });
        logChart.data.labels = labels;
        logChart.data.datasets[0].data = pm25Data;
        logChart.update();
      }
    });
  </script>
</body>
</html>
